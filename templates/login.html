{% extends "base.html" %}
{% block title %}Ingresar{% endblock %}
{% block content %}
<div class="login-box">
  <img class="login-logo" src="{{ url_for('static', filename='traqeer-logo.png') }}" alt="Traqeer">
  <h1>Customers Dashboard</h1>
  <p class="muted">Ingresá la clave del equipo.</p>
  <form method="post">
    <input type="password" name="password" placeholder="Clave" autofocus required>
    <button type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
